# ─────────────────────────────────────────────────────────────────────────────
# Provider Service (Product Service) — GitLab CI Pipeline
#
# Flow:
#   branch-name → build → test → pact-verify → soak-test → can-i-deploy → deploy
#
# Branching: feature branches + MRs into main. Feature branches must be named
#   feature/issue-<JIRA KEY>   e.g. feature/issue-JIRA-123, feature/issue-JIRA123
# Use the same branch name as the consumer change so the matchingBranch
# selector picks up its pact. pact-verify is blocking everywhere (new consumer
# expectations are pending, so they don't break the build); can-i-deploy is
# blocking on main, advisory everywhere else.
#
# Required CI/CD variables (Settings → CI/CD → Variables):
#   PACT_BROKER_BASE_URL  Your broker URL
#   and either, for a self-hosted broker:
#     PACT_BROKER_USERNAME  pact
#     PACT_BROKER_PASSWORD  (mark as Masked)
#   or, for PactFlow:
#     PACT_BROKER_TOKEN     API token (mark as Masked)
# pact-broker CLI and the provider verifier read these from the environment,
# so switching broker only means changing variables.
# ─────────────────────────────────────────────────────────────────────────────

image: php:8.3-cli-alpine

# One pipeline per push: an MR pipeline when the branch has an open MR,
# otherwise a branch pipeline. Broker webhook triggers always run.
workflow:
    rules:
        - if: '$CI_PIPELINE_SOURCE == "trigger"'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
          when: never
        - if: '$CI_COMMIT_BRANCH'

stages:
    - build
    - test
    - pact-verify
#    - soak-test
    - can-i-deploy
    - deploy

# ── Variables ─────────────────────────────────────────────────────────────────
variables:
    PROVIDER_BASE_URL: "http://localhost:8002"
    APP_VERSION: $CI_COMMIT_SHORT_SHA

# ── Cache ─────────────────────────────────────────────────────────────────────
# Note: ineffective on Kubernetes runners without a distributed cache backend.
# Left in place so gitlab.com pipelines still benefit and self-hosted picks it
# up automatically if the platform team configures S3/GCS/MinIO later.
cache:
    key: "${CI_COMMIT_REF_SLUG}-composer"
    paths:
        - vendor/
        - .composer/

# ── Before script ─────────────────────────────────────────────────────────────
before_script:
    - apk add --no-cache curl zip unzip git icu-dev oniguruma-dev libzip-dev libffi-dev bash rabbitmq-c-dev $PHPIZE_DEPS linux-headers
    - docker-php-ext-install intl zip mbstring ffi
    - pecl install amqp && docker-php-ext-enable amqp
    - echo "ffi.enable=1" >> /usr/local/etc/php/php.ini
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: .pre — reject branches that don't follow the naming convention.
# Every job chains back to composer-install, which waits on .pre, so a failure
# here stops the whole pipeline before any verification results are published.
# ─────────────────────────────────────────────────────────────────────────────
branch-name:
    stage: .pre
    image: alpine:3
    before_script: []
    variables:
        BRANCH_PATTERN: '^feature/issue-[A-Z][A-Z0-9]*-?[0-9]+$'
    script:
        - |
            if ! echo "${CI_COMMIT_REF_NAME}" | grep -Eq "${BRANCH_PATTERN}"; then
              echo "ERROR: branch '${CI_COMMIT_REF_NAME}' does not match ${BRANCH_PATTERN}"
              echo "Use feature/issue-<JIRA KEY>, e.g. feature/issue-JIRA-123"
              exit 1
            fi
    rules:
        - if: '$CI_COMMIT_REF_NAME != "main"'

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: build
# ─────────────────────────────────────────────────────────────────────────────
composer-install:
    stage: build
    script:
        - composer install --no-interaction --optimize-autoloader --no-progress
    artifacts:
        paths:
            - vendor/
        expire_in: 1 hour

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: test
# ─────────────────────────────────────────────────────────────────────────────
unit-tests:
    stage: test
    needs: [composer-install]
    script:
        - php vendor/bin/phpunit tests/ --exclude-group=contract --testdox
    artifacts:
        reports:
            junit: test-results/junit.xml
        when: always

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: pact-verify
# ─────────────────────────────────────────────────────────────────────────────
pact-verify:
    stage: pact-verify
    needs:
        - job: composer-install
          artifacts: true
        - job: unit-tests
          artifacts: false
    script:
        - composer install --no-interaction --no-progress
        - rm -rf var/cache/*
        - mkdir -p var/cache var/log
        - APP_ENV=dev php -S 0.0.0.0:8002 -t public/ > /tmp/php-server.log 2>&1 &
        - |
            READY=0
            for i in $(seq 1 10); do
              if curl -sf http://localhost:8002/api/products/health -o /dev/null; then
                echo "Provider ready after ${i}s"
                READY=1
                break
              fi
              sleep 1
            done
            if [ "$READY" -eq "0" ]; then
              echo "ERROR: Provider didn't come up"
              cat /tmp/php-server.log
              exit 1
            fi
        - curl -s http://localhost:8002/api/products/1 | tee /tmp/actual-response.json
        - php vendor/bin/phpunit tests/Contract --testdox
    after_script:
        - cat /tmp/php-server.log 2>/dev/null || true

