# ─────────────────────────────────────────────────────────────────────────────
# STAGE: can-i-deploy
# Single invocation with two --pacticipant flags — one atomic check against
# the broker for both the REST service and its async/events counterpart.
# ─────────────────────────────────────────────────────────────────────────────
can-i-deploy:
    stage: can-i-deploy
    needs: [pact-verify]
    image: pactfoundation/pact-cli:latest
    before_script: []
    script:
        - |
            pact-broker can-i-deploy \
              --pacticipant="ProductService" --version="${APP_VERSION}" \
              --pacticipant="ProductService-Events" --version="${APP_VERSION}" \
              --to-environment=production \
              --retry-while-unknown=6 \
              --retry-interval=10
    # Webhook-triggered runs only re-verify consumer pacts; never deploy.
    # Blocking on main; advisory on feature branches/MRs.
    rules:
        - if: '$CI_PIPELINE_SOURCE == "trigger"'
          when: never
        - if: '$CI_COMMIT_REF_NAME == "main"'
        - allow_failure: true

# ─────────────────────────────────────────────────────────────────────────────
# STAGE: deploy
# ─────────────────────────────────────────────────────────────────────────────
deploy-production:
    stage: deploy
    needs: [can-i-deploy]
    image: pactfoundation/pact-cli:latest
    before_script: []
    # ⚠️ record-deployment MUST only run after a successful deploy.
    # `set -e` aborts the script block on any failure, so if a real deploy
    # command is added above and fails, the broker will not be told we deployed.
    script:
        - set -e
        - echo "Deploying ProductService ${APP_VERSION} to production..."
        # TODO: replace echo with real deploy (kubectl, helm, etc.)
        - echo "Deploy complete."
        - |
            pact-broker record-deployment \
              --pacticipant="ProductService" \
              --version="${APP_VERSION}" \
              --environment=production
        - |
            pact-broker record-deployment \
              --pacticipant="ProductService-Events" \
              --version="${APP_VERSION}" \
              --environment=production
    environment:
        name: production
    rules:
        - if: '$CI_PIPELINE_SOURCE == "trigger"'
          when: never
        - if: '$CI_COMMIT_BRANCH == "main"'
